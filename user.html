<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a Grocery account.">
  <title>Sign Up | Grocery</title>
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="style_login.css">
</head>
<body>
  <main id="container">
    <form id="auth-form" data-auth-mode="signup">
      <h1 id="SignInh2">Create Account</h1>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password (at least 6 characters)" autocomplete="new-password" minlength="6" required>
      <button type="submit" id="btn1">Sign Up</button>
      <p id="auth-message" role="status" aria-live="polite"></p>
      <p>Already have an account? <a href="login.html">Sign in</a></p>
      <p><a href="index.html">Back to home</a></p>
    </form>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
